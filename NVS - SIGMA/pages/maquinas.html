section class="tela-maquinas">

    <div class="cabecalho-tela">

        <h1>Máquinas</h1>

        <div class="seletor-linha">

    <label>Linha de Produção</label>

    <select id="maquinaSelecionada">

    <option value="1">L1</option>
    <option value="2">L2</option>
    <option value="3">L3</option>
    <option value="4">L4</option>
    <option value="5">L5</option>

</select>

</div>

    </div>

    <div class="card-maquina">

</div>

        <div class="tempo">

            <button id="btnProduzir">
                ▶ Simular Produção

            </button>
